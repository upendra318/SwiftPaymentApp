apiVersion: apps/v1
kind: Deployment
metadata:
  name: swiftpay-app
  labels:
    app: swiftpay-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swiftpay-app
  template:
    metadata:
      labels:
        app: swiftpay-app
    spec:
      containers:
        - name: swiftpay-app
          image: swiftpay-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/swiftpay
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
